name: CI

on:
  push:
    branches: 
      - develop
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Check SECRET_KEY availability
        run: |
          if [ -z "$SECRET_KEY" ]; then
            echo "SECRET_KEY is missing"
            exit 1
          else
            echo "SECRET_KEY is configured"
          fi

      - name: Checkout Django configuration
        run: python manage.py check --settings=config.settings_test


      - name: Run tests
        run: python manage.py test --settings=config.settings_test
