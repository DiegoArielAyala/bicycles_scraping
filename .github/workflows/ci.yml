name: CI

on:
  push:
    branches: 
      - develop
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env: 
          POSTGRES_DB: db_test
          POSTGRES_USER: user_test
          POSTGRES_PASSWORD: password_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user_test -d db_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: "ci-test-only-not-a-real-secret"
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: db_test
      DB_USER: user_test
      DB_PASSWORD: password_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Django configuration
        run: python manage.py check --settings=config.settings_test


      - name: Run tests
        run: python manage.py test --settings=config.settings_test
