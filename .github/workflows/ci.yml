name: CI

on:
  push:
    branches: 
      - develop
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        
      - name: Checkout Django configuration
        run: python manage.py check --settings=config.settings_test

      - name: Run tests
        run: python manage.py test --settings=config.settings_test
