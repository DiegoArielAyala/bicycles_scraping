name: Deploy

on:
  push:
    branches:
      - develop
      - master

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false
  
jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: db_test
          POSTGRES_USER: user_test
          POSTGRES_PASSWORD: password_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user_test -d db_test"
          --health-interval 60s
          --health-timeout 20s
          --health-retries 5
    env:
      SECRET_KEY: "ci-test-only-not-a-real-secret"
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: db_test
      DB_USER: user_test
      DB_PASSWORD: password_test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Check Django configuration
        run: python manage.py check --settings=config.settings_test
      
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run --settings=config.settings_test

      - name: Run tests
        run: python manage.py test --settings=config.settings_test
  
  migrate_staging:
    name: Migrate Staging
    needs: test
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply migrations
        run: python manage.py migrate --noinput
  
  deploy-staging:
    name: Deploy Staging
    needs: migrate_staging
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Render Staging
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_STAGING }}
        run: curl -fsS -X POST "$RENDER_HOOK"

  migrate_production:
    name: Migrate Production
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip 
          pip install -r requirements.txt
      
      - name: Apply migrations
        run: python manage.py migrate --noinput
  
  deploy_production:
    name: Deploy Production
    needs: migrate_production
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Render Production
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_PRODUCTION }}
        run: curl -fsS -X POST "$RENDER_HOOK"

