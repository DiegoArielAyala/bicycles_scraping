{% extends "base.html" %}
{% load static %}

{% block content %}
<main class="container py-3">
    <section class="card shadow-lg rounded-4 border-0 p-4 bg-dark text-light">
        <div class="text-center mb-4">
            <h2 class="display-4 mb-3 text-accent fw-bold">My Subscriptions</h2>
            <p class="text-secondary fs-5">Bicycles you are watching for price alerts.</p>
        </div>

        <p class="text-center text-secondary fs-5" id="subscriptions-status"></p>
        <div id="subscriptions-list" class="d-flex flex-column gap-3"></div>
    </section>
</main>
{% endblock %}

{% block scripts %}
    {{ block.super }}
    <script type="module" src="{% static 'js/my_subscriptions.js' %}"></script>
{% endblock %}
