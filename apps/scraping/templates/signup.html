{% extends "base.html" %}
{% load static %}

{% block content %}
<main class="container py-3">
    <section class="card shadow-lg rounded-4 border-0 p-4 bg-dark text-light">
        <div class="text-center mb-3 ">
            <h2 class="display-4 text-accent fw-bold mb-3">Sign up</h2>
        </div>

        <form class="d-flex flex-column align-items-center gap-3" id="signup-form" action="/signup/" method="POST">
            {% csrf_token %}
            

            <div class="d-flex w-100 text-center my-3 justify-content-center">
                <label class="text-end w-25 text-secondary fs-4 my-auto me-3" for="username-input">Username:</label>
                <input class="bg-dark w-50 my-auto form-control fs-5 border-accent text-light placeholder-light" type="text" name="username" id="username-input" placeholder="" autofocus required>
            </div>
            
            <div class="d-flex w-100 text-center mb-3 justify-content-center">
                <label class="text-end w-25 text-secondary fs-4 my-auto me-3" for="password1-input">Password:</label>
                <input class="bg-dark w-50 my-auto form-control fs-5 border-accent text-light placeholder-light" type="password" name="password1" id="password1-input" placeholder="" autofocus required>
            </div>
            
            <div class="d-flex w-100 text-center mb-3 justify-content-center">
                <label class="text-end w-25 text-secondary fs-4 my-auto me-3" for="password2-input">Repeat password:</label>
                <input class="bg-dark w-50 my-auto form-control fs-5 border-accent text-light placeholder-light" type="password" name="password2" id="password2-input" placeholder="" autofocus required>
            </div>
            
            <div class="text-secondary fs-5">
                {{error}}
            </div>

            <div class="text-center py-3">
                <button class="btn btn-accent btn-lg px-5 shadow-sm">Sign Up</button>
            </div>

            <div class="text-secondary fs-5" id="response-container"></div>
        </form>

    </section>
</main>
{% endblock %}

{% block scripts %}
    <script src="{% static 'js/signup.js' %}"></script>
{% endblock %}
