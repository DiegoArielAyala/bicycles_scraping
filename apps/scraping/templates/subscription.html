{% extends "base.html" %}
{% load static %}

{% block content %}
<main class="container py-3">
    <section class="card shadow-lg rounded-4 border-0 p-4 bg-dark text-light">
        <div class="text-center mb-3">
            <h2 class="display-4 mb-3 text-accent fw-bold">Subscription</h2>
            <p class="text-secondary fs-5">Get alerts when the price changes.</p>
            
            <form class="d-flex flex-column align-items-center gap-3" id="subscription-form" action="" method="POST">
                {% csrf_token %}
                    
                <div class="d-flex text-center mt-3 mb-3 w-100 justify-content-center">
                    <label class="text-end text-secondary fs-4 my-auto me-3 w-25" for="email-input">Email:</label>
                    <input class="form-control w-50 border-accent bg-dark my-auto text-light placeholder-light" type="email" name="email" id="email-input" placeholder="">
                </div>
                
                <div class="d-flex text-center mb-3 w-100 justify-content-center">
                    <label class="text-end text-secondary fs-4 my-auto me-3 w-25" for="reference-input">Reference:</label>
                    <input class="form-control w-50 border-accent bg-dark my-auto text-light placeholder-light" type="number" name="reference" id="reference-input" placeholder="" value="{{ reference }}">
                </div>
                
                <div class="text-center">
                    <p class="text-secondary fs-4" id="response-container"></p>
                </div>

                <div class="text-center py3">
                    <button class="btn btn-lg btn-accent px-5 shadow-sm">Subscribe</button>
                </div>
            </form>
        </div>

    </section>
</main>
{% endblock %}

{% block scripts %}
    {{ block.super }}
        <script type="module" src="{% static 'js/subscription.js' %}"></script>
{% endblock %}
