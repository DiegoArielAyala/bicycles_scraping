services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: bike_tracker_web
    volumes:
      - ..:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    env_file:
      - ../.env
    secrets:
      - prometheus_token
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export PROMETHEUS_TOKEN="$$(tr -d '\n' < /run/secrets/prometheus_token)"
        exec python3 manage.py runserver 0.0.0.0:8000

  db:
    image: postgres:15
    ports:
      - "5433:5432"
    volumes:
      - bikeprice_postgres_data:/var/lib/postgresql/data
  
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
  
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: bike_tracker_worker
    command: celery -A config worker --loglevel=info -Q scraping
    volumes:
      - ..:/app
    env_file:
      - ../.env
    depends_on:
      - redis
      - db
  
  email_worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: bike_tracker_email_worker
    command: celery -A config worker --loglevel=info -Q emails
    volumes:
      - ..:/app
    env_file:
      - ../.env
    depends_on:
      - redis
      - db

  beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: bike_tracker_beat
    command: celery -A config beat --loglevel=info
    volumes:
      - ..:/app
    env_file:
      - ../.env
    depends_on:
      - redis
      - db
  
  prometheus:
    image: prom/prometheus:latest
    container_name: bike_tracker_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    secrets:
      - prometheus_token
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: bike_tracker_grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  bikeprice_postgres_data:
  prometheus_data:
  grafana_data:

secrets:
  prometheus_token:
    file: ./secrets/prometheus_token.txt