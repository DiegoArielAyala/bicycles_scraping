services:
  web:
    build: .
    container_name: bike_tracker_web
    command: python3 manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - .env

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD} 
    ports:
      - "5433:5432"
    volumes:
      - bikeprice_postgres_data:/var/lib/postgresql/data

volumes:
  bikeprice_postgres_data: