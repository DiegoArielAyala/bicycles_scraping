services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: bike_tracker_web
    command: python3 manage.py runserver 0.0.0.0:8000
    volumes:
      - ..:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    env_file:
      - ../.env

  db:
    image: postgres:15
    ports:
      - "5433:5432"
    volumes:
      - bikeprice_postgres_data:/var/lib/postgresql/data
  
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
  
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: bike_tracker_worker
    command: celery -A config worker --loglevel=info -Q scraping
    volumes:
      - ..:/app
    env_file:
      - ../.env
    depends_on:
      - redis
      - db
  
  email_worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: bike_tracker_email_worker
    command: celery -A config worker --loglevel=info -Q emails
    volumes:
      - ..:/app
    env_file:
      - ../.env
    depends_on:
      - redis
      - db

  beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: bike_tracker_beat
    command: celery -A config beat --loglevel=info
    volumes:
      - ..:/app
    env_file:
      - ../.env
    depends_on:
      - redis
      - db

volumes:
  bikeprice_postgres_data: